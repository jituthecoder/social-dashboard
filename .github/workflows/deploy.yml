name: Deploy Social Dashboard to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add SSH Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT || '65002' }} ${{ secrets.HOSTINGER_HOST || '195.179.238.121' }} >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger Server
        run: |
          rsync -e "ssh -p ${{ secrets.HOSTINGER_PORT || '65002' }} -o StrictHostKeyChecking=no" -avz --delete dist/ ${{ secrets.HOSTINGER_USER || 'u971218733' }}@${{ secrets.HOSTINGER_HOST || '195.179.238.121' }}:/home/u971218733/domains/a4autopost.com/public_html/dashboard/
